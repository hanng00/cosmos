AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Cosmos backend

Globals:
  Function:
    Timeout: 3
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    
Resources:
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
            Identity:
              Header: Authorization
        AddDefaultAuthorizerToCorsPreflight: false

      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,OPTIONS'"
        AllowOrigin: "'*'"
        AllowHeaders: "'*'"

      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'*'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,OPTIONS'"
        DEFAULT_4XX:
          StatusCode: 400
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'*'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,OPTIONS'"

  CosmosBackendTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TableName: !Sub "${AWS::StackName}-backend-table"
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  # <--- Cognito ---
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web-client
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/getHealth.lambdaHandler
      Events:
        GetHealth:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true

  GetMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/features/auth/getMe.lambdaHandler
      Events:
        GetMe:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /me
            Method: get
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true

  PostBrandFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/features/brands/postBrand.lambdaHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CosmosBackendTable
      Events:
        PostBrand:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /brands
            Method: post
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true

  GetBrandsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/features/brands/getBrands.lambdaHandler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CosmosBackendTable
      Events:
        GetBrands:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /brands
            Method: get
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true
  PostGenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/features/brands/postGenerate.lambdaHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CosmosBackendTable
      Events:
        PostGenerateGlobal:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /brands/{brandId}/generate
            Method: post
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true

  CreateBrandVoiceAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/features/brandVoices/createAnalysis.lambdaHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CosmosBackendTable
      Events:
        CreateBrandVoiceAnalysis:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /brand-voices/analyses
            Method: post
            Auth:
              Authorizer: NONE
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true

  PutBrandVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/features/brands/putBrandVoice.lambdaHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CosmosBackendTable
      Events:
        PutBrandVoice:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /brands/{brandId}/voice
            Method: put
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true

  GetBrandVoiceAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/features/brandVoices/getAnalysis.lambdaHandler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CosmosBackendTable
      Events:
        GetBrandVoiceAnalysis:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /brand-voices/analyses/{analysisId}
            Method: get
            Auth:
              Authorizer: NONE
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true

  BrandVoiceAnalysisWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/features/brandVoices/analysisWorker.lambdaHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CosmosBackendTable
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
      Events:
        OnBrandVoiceInsert:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt CosmosBackendTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true

  CreateFreeBrandVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/features/brandVoices/createFreeBrandVoice.lambdaHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CosmosBackendTable
      Events:
        CreateFreeBrandVoice:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /brand-voices/free
            Method: post
            Auth:
              Authorizer: NONE
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true

  ClaimFreeBrandVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/features/brandVoices/claimFreeBrandVoice.lambdaHandler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CosmosBackendTable
      Events:
        ClaimFreeBrandVoice:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /brand-voices/free/{freeVoiceId}/claim
            Method: post
      Environment:
        Variables:
          TABLE_NAME: !Ref CosmosBackendTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Sourcemap: true

Outputs:
  ApiBaseUrl:
    Description: API base URL for Prod stage
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
